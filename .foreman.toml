# Foreman configuration for foreman's own repo (dogfood).
#
# Plan-affecting keys here (runner, image, trusted_actors, required_capabilities,
# [reviewer], [verify]) are read from the DEFAULT BRANCH of Foreman's own clone, never
# from a dispatched branch — an agent must not edit its own trust or gate.

# v2.0 ships only the local runner. sprite (v2.1) is what makes untrusted
# dogfooding safe. NOTE (D4): this repository is PUBLIC as of 2026-08-04 —
# the world can create or edit issues, so the repo predicate classifies
# EVERY unit as requiring the `untrusted-input` boundary, which local never
# provides. Dispatch therefore refuses here BY DESIGN until SpriteRunner
# (#8) ships. plan still runs and REPORTS the refusal (exiting nonzero);
# vet skips refused units; status and preflight are unaffected.
runner = "local"

backend = "claude"
require_approval = true
inputs = "auto"
expected_login = "evanharmon1-bot"

# The accounts whose issue content and arming are trusted (D4/D13). Keep
# this tight — it is the trust boundary for local dispatch. Renovate and
# CodeRabbit author issues/PRs here; list the bots you actually trust to
# arm and to author dispatchable content.
trusted_actors = ["evanharmon1", "evanharmon1-bot", "AdmiralFraggle", "admiralfraggle-bot", "Jessedroptable"]

# DECLARED hard requirements: none — the baseline gate needs no special
# capabilities. Refusal still happens anyway: D4 injects `untrusted-input`
# on this public repo regardless of this list (see the runner note above).
required_capabilities = []

# subscription (default): claude inherits CLAUDE_CODE_OAUTH_TOKEN; USD budgets
# are inert. api: adapters consume their dedicated FOREMAN_*_API_KEY
# process-locally. Only adapters advertising verified cost bind USD budgets.
billing = "subscription"

# Set FOREMAN_SANDBOXED=1 (env) inside the egress-limited bot devcontainer
# to relax the agent permission mode; the committed default stays
# conservative for any other host.
sandboxed = false

# Agent image pin: <registry>/<repo>[:tag]@sha256:<digest>. Consumed by the
# sprite runner (#30); LocalRunner ignores it (it boots no image). GHCR tags
# are mutable — the digest is the identity. Bump via
# `task image:pin:set REF=...` with the ref from the Devcontainer Build
# workflow's step summary.
image = "ghcr.io/ponderousdev/foreman-devcontainer@sha256:3fb1e96b688e1a83e5c2834214f6e3c193c14e2537f39a3d9bf3b3a51f610281"

# The composed verify gate (#29). Foreman's own `verify` is check + build +
# test and needs no daemon; the docker-keyed addition (devcontainer smoke +
# permission assert) runs where a daemon is present and is GitHub Actions'
# job otherwise. No `ports` key: this repo has no port-binding e2e.
# NOTE: [verify] must stay below every top-level key — in TOML, keys after
# a section header belong to that section until the next header.
[verify]
default = ["task", "verify"]
docker = ["task", "test:devcontainer:permissions"]

[budgets]
dispatch_usd = 20.0
shepherd_usd = 10.0

[timeouts]
dispatch_min = 90
shepherd_min = 30
