name: Devcontainer Build
run-name: ${{ github.actor }} is ${{ github.event_name == 'push' && 'prebuilding' || 'testing' }} devcontainers

on:
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-build.yml"
      - "scripts/verify-ci-results.sh"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-build.yml"
      - "scripts/verify-ci-results.sh"
  workflow_dispatch:

concurrency:
  group: devcontainer-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs with the same build steps, split so the registry-WRITE scope only
# exists in the trusted-event job (#108 Gap 2): `build` validates PR branches
# with packages:read (enough to pull the private registry cache, no write
# capability in the job env while untrusted branch content executes);
# `publish` runs on push/dispatch, where refs are maintainer-gated, and is
# the only job holding packages:write.
jobs:
  build:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai
            config_file: .devcontainer/devcontainer.json
            image_name: ghcr.io/ponderousdev/foreman-devcontainer
          - name: dev
            config_file: .devcontainer/dev/devcontainer.json
            image_name: ghcr.io/ponderousdev/foreman-devcontainer-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # renovate: datasource=node-version depName=node
          node-version: "24"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"
      # Read-scoped login: needed only to PULL the private registry cache.
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free up runner disk space
        # Only on disposable GitHub-hosted runners: these rm -rf / prune commands
        # would permanently delete real SDKs and Docker images on a persistent
        # self-hosted runner. The devcontainer image is large (toolchains,
        # browsers, language runtimes), and hosted ubuntu-latest's free space is
        # too small — the build fails with "no space left on device" — so reclaim
        # ~13GB of preinstalled SDKs we don't use. Self-hosted machines are
        # assumed to have adequate disk and are skipped entirely.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - name: Build ${{ matrix.name }} devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CODER: ""
          GH_TOKEN: ""
          TS_AUTHKEY: ""
        with:
          # Dedicated registry cache ref with mode=max: inline cache
          # (BUILDKIT_INLINE_CACHE) does not survive the devcontainer CLI's
          # multi-stage load-then-push flow, so cacheFrom on the image itself
          # never produced cache hits. This job builds a single tag, so the
          # action still auto-adds the image name as a fallback cacheFrom and
          # only the -cache ref is listed here; `publish` pushes two tags,
          # which disables that fallback, so it lists the image explicitly.
          # Cache is only written by `publish`, never from PR builds.
          cacheFrom: type=registry,ref=${{ matrix.image_name }}-cache
          configFile: ${{ matrix.config_file }}
          imageName: ${{ matrix.image_name }}
          push: never
      - name: Clean up buildx cache and dangling images
        if: always()
        continue-on-error: true
        run: |
          docker buildx prune --force --keep-storage 20GB
          docker image prune --force

  publish:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai
            config_file: .devcontainer/devcontainer.json
            image_name: ghcr.io/ponderousdev/foreman-devcontainer
          - name: dev
            config_file: .devcontainer/dev/devcontainer.json
            image_name: ghcr.io/ponderousdev/foreman-devcontainer-dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # renovate: datasource=node-version
          node-version: "24"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free up runner disk space
        # See the `build` job's copy of this step for the rationale.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - name: Build ${{ matrix.name }} devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CODER: ""
          GH_TOKEN: ""
          TS_AUTHKEY: ""
        with:
          # See the `build` job's copy of this step for the cache rationale.
          # Supplying more than one imageTag disables the action's automatic
          # fallback cacheFrom on the image name, so `:latest` is listed here
          # explicitly alongside the dedicated -cache ref.
          # workflow_dispatch builds without publishing (push/cacheTo gated to
          # the push event), preserving the pre-split behavior.
          cacheFrom: |
            type=registry,ref=${{ matrix.image_name }}-cache
            ${{ matrix.image_name }}:latest
          cacheTo: ${{ github.event_name == 'push' && format('type=registry,ref={0}-cache,mode=max', matrix.image_name) || '' }}
          configFile: ${{ matrix.config_file }}
          imageName: ${{ matrix.image_name }}
          # `latest` is the rolling human/cache tag; `sha-<commit>` is the
          # provenance tag a digest pin is resolved from. Both tags are
          # MUTABLE by registry semantics — the digest is the identity.
          imageTag: latest,sha-${{ github.sha }}
          push: ${{ github.event_name == 'push' && 'always' || 'never' }}
      - name: Resolve published digest
        # devcontainers/ci exposes no digest output, so re-read the manifest
        # from the registry (the login above still applies): prints the
        # immutable `IMAGE:TAG@sha256:...` pin into the step summary, which is
        # the sanctioned source for `task image:pin:set`, and fails the job if
        # what was pushed is not exactly linux/amd64 — the assertion that
        # stands in for the unsafe `platform:` input.
        if: github.event_name == 'push'
        run: bash scripts/agent-image-digest.sh "${{ matrix.image_name }}" "sha-${{ github.sha }}"
      - name: Clean up buildx cache and dangling images
        if: always()
        continue-on-error: true
        run: |
          docker buildx prune --force --keep-storage 20GB
          docker image prune --force

  devcontainer-verify:
    if: always()
    needs: [build, publish]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skip at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != "skipped" ]; then
            echo "Job build result: $BUILD_RESULT (expected skipped for an untrusted fork)"
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: the repository-controlled devcontainer build was deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify devcontainer build succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          BUILD_RESULT: ${{ needs.build.result }}
        run: ./scripts/verify-ci-results.sh "build=${BUILD_RESULT}"
