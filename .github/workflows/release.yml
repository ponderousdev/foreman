name: Release Please
run-name: release-please maintaining the release PR

# Releases stay intentional: release-please maintains a rolling release PR from
# conventional commits (feat -> minor, fix -> patch; pre-1.0 feat bumps minor;
# chore/docs/ci produce no release). Merging that PR — a deliberate act — is
# what creates the tag, GitHub release, and CHANGELOG entry. Nothing is bumped
# automatically on a normal merge to main.

on:
  push:
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # CI GitHub App token, not GITHUB_TOKEN: PRs opened by GITHUB_TOKEN never
      # trigger CI, and branch protection requires those checks to pass before
      # the release PR can merge. (Same App the claude-* workflows use.)
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          # Least-privilege: release-please commits/tags/releases (contents),
          # maintains the release PR (pull-requests), and applies the
          # autorelease:* lifecycle labels (issues — PR labels use the Issues API).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      # release-please bumps pyproject.toml but not uv.lock, which fails every
      # `uv run --locked` gate on the release PR. Refresh the lock in the same
      # run that (re)generated the branch — it is force-updated on every push
      # to main, so the refresh must follow every update, not happen once.
      # Checkout uses the App token so the push re-triggers the PR's checks.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: release-please--branches--main
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: ${{ steps.release.outputs.pr }}
      - name: Refresh uv.lock on the release PR
        if: ${{ steps.release.outputs.pr }}
        run: bash scripts/release-lock-refresh.sh
