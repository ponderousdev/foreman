name: Build & Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Parallel jobs that all call into the Taskfile so local + CI run identical commands.
# A final `verify` job aggregates statuses for branch protection
# (required checks: verify + security). Every job's toolchain setup goes through
# the shared ./.github/actions/setup composite action.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
      - name: Lint
        run: task check
      - run: task test:tasks
      - run: task test:release-title
      - run: task test:image:pin
      - run: task test:image:digest
      - name: Skills drift check (vendored skills vs pinned harmon-devkit ref)
        run: task verify:skills
      - run: task test:hooks
      - run: task test:devcontainer:permissions

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  test:
    # Tier 1 of docs/architecture/tests.md: hermetic pytest suite — fake gh
    # transport, real subprocesses, no Docker daemon, no network.
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test
        run: task test

  verify:
    if: always()
    needs: [lint, security, test]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Check job results
        run: |
          fail=0
          check() {
            [ "$2" = "success" ] || [ "$2" = "skipped" ] || { echo "Job $1 result: $2"; fail=1; }
          }
          check lint "${{ needs.lint.result }}"
          check security "${{ needs.security.result }}"
          check test "${{ needs.test.result }}"
          if [ "$fail" -ne 0 ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
