# Foreman is distributed as a git-tag `uvx` invocation (spec D11): consumers run
# `uvx --from git+https://github.com/ponderousdev/foreman@vX.Y.Z foreman`, so this
# package must build from a plain git checkout with a stock PEP 517 backend —
# no generated files, no exotic build steps.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foreman"
# Version is managed by release-please (release-type: python); do not hand-edit.
version = "2.3.0"
description = "Deterministic supervisor for dispatching agent work across local, Docker, and Sprite runners"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Runtime is deliberately stdlib-only; the entire vendor/tool surface is shelled
# out (gh, git, backends/*.sh). Keep it that way.
dependencies = []

[project.scripts]
foreman = "foreman.cli:main"

[project.urls]
Repository = "https://github.com/ponderousdev/foreman"
Documentation = "https://github.com/ponderousdev/foreman/tree/main/docs"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foreman"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
files = ["src/foreman"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
